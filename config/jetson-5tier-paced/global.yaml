# =============================================================================
# Jetson Orin Nano 7台 5段HFL 長時間実験 (10分間隔): Global Server 設定
#
# 学習は 10 分に 1 ラウンド (毎時 0, 10, 20 … 分に開始)。1日 144 ラウンド。
# 通信量は連続実行 (約18秒/ラウンド) の約 1/33。精度は約100ラウンドで上限 (0.76〜0.77) 付近。
# max_duration_hours (または --max-hours) を過ぎると、次のラウンドを始めずに正常停止する。
# =============================================================================

server:
  address: "0.0.0.0:8080"
  num_rounds: 1000000
  max_duration_hours: 48        # 2日。--max-hours で上書き可
  round_interval_s: 600         # ラウンドの間隔 (秒)。--round-interval で一時的に短くできる
  round_align: "clock"          # clock: 時計の区切り (600 秒なら毎時 0, 10, … 分) に合わせる / none
  round_timeout: 1500.0         # Edge集約完了を最大25分待つ
  checkpoint_every: 1           # 毎ラウンド保存 (0.75 MB / 10分)
  min_fit_clients: 2
  min_available_clients: 2
  fraction_fit: 1.0

strategy:
  name: "fedavg"
  params: {}

model:
  name: "simplecnn"
  num_classes: 10

dataset:
  name: "cifar10"
  test_batch_size: 128

evaluation:
  enabled: true
  log_dir: "./runs"

mode: "production"
dry_run:
  global_rounds: 2
  sub_rounds: 1
  dummy_data_size: 64
  dummy_steps: 2
  round_interval_s: 10          # 疎通確認では 10 秒間隔 (10 分待たない)
