# =============================================================================
# Jetson Orin Nano 7台 5段HFL 長時間実験 (バッテリー/ソーラー): Global Server 設定
#
# num_rounds は実質無限。max_duration_hours (または --max-hours) を過ぎた
# ラウンド境界で正常停止する。scripts/hfl.sh stop でも同じ経路で停止する。
# 実測 1ラウンド ≈ 18 秒 (初回 ≈ 140 秒) に対し、タイムアウトは誤検知しない余裕を取る。
# =============================================================================

server:
  address: "0.0.0.0:8080"
  num_rounds: 1000000
  max_duration_hours: 240       # 10日。--max-hours で上書き可
  round_timeout: 1500.0         # Edge集約完了を最大25分待つ
  # Global モデルの保存間隔 (ラウンド)。停止時にも保存する。0.75 MB/回なので
  # microSD の書き込み量を抑えて 5 ラウンド (約1.5分) ごと。再開時に失うのは最大4ラウンド
  checkpoint_every: 5
  min_fit_clients: 2
  min_available_clients: 2
  fraction_fit: 1.0

strategy:
  name: "fedavg"
  params: {}

model:
  name: "simplecnn"
  num_classes: 10

dataset:
  name: "cifar10"
  test_batch_size: 128

evaluation:
  enabled: true
  log_dir: "./runs"

mode: "production"
dry_run:
  global_rounds: 2
  sub_rounds: 1
  dummy_data_size: 64
  dummy_steps: 2
