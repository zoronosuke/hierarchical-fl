# =============================================================================
# Edge Server 02 固有設定
# =============================================================================

edge:
  id: "edge_02"
  sub_server_address: "0.0.0.0:9002"
  global_server_address: "127.0.0.1:8080"

  sub_rounds: 1
  sub_round_timeout: 120.0
  min_fit_clients: 3
  min_available_clients: 3
  startup_timeout: 60.0
  parent_model_timeout: 300.0
  parent_result_timeout: 270.0
  shutdown_timeout: 30.0

  contribution_factor: 1.0

  internal_client:
    enabled: true
