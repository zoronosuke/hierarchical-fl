# =============================================================================
# 1PC 5段HFL 学習間隔の試験: Global Server 設定 (dry-run で 3 秒間隔・4 ラウンド)
#   uv run python run.py --dry-run --global-config config/local-5tier/global_paced.yaml \
#       --topology-config config/local-5tier/topology.yaml
# =============================================================================

server:
  address: "0.0.0.0:8080"
  num_rounds: 4
  round_interval_s: 3
  round_align: "clock"
  round_timeout: 300.0
  checkpoint_every: 1
  min_fit_clients: 2
  min_available_clients: 2
  fraction_fit: 1.0

strategy:
  name: "fedavg"
  params: {}

model:
  name: "simplecnn"
  num_classes: 10

dataset:
  name: "cifar10"
  test_batch_size: 128

evaluation:
  enabled: true
  log_dir: "./runs"

mode: "production"
dry_run:
  global_rounds: 4
  sub_rounds: 1
  dummy_data_size: 64
  dummy_steps: 2
  round_interval_s: 3
