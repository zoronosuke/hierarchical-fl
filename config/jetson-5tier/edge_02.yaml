# =============================================================================
# Jetson Orin Nano 7台 5段HFL実験: edge_02 設定
# =============================================================================

edge:
  id: "edge_02"
  sub_server_address: "0.0.0.0:9002"
  global_server_address: "192.168.10.201:8080"   # 直上サーバー (Global または上位Edge)

  sub_rounds: 1
  sub_round_timeout: 3600.0
  min_fit_clients: 1
  min_available_clients: 1
  startup_timeout: 600.0
  parent_model_timeout: 1800.0
  parent_result_timeout: 3900.0
  shutdown_timeout: 60.0

  contribution_factor: 1.0

  internal_client:
    enabled: true
